# Merged over the sandbox's CODEX_HOME/config.toml (state/iso-codex) on every
# launch by iso-merge-config (src/iso-claude/bin/iso-agent): these keys win,
# tables merge key by key, every other key in that file is kept. Keys that only
# fill a first run (the model, so /model survives) are in defaults.toml.
# Never the host ~/.codex.
#
# Bedrock through Codex's built-in amazon-bedrock provider (bedrock-mantle,
# SigV4 from the AWS profile the sandbox's AWS_CONFIG_FILE defines).
model_provider = "amazon-bedrock"

# The image pins Codex (Dockerfile CODEX_VERSION); its startup update prompt
# would npm-install another version into the container layer.
check_for_update_on_startup = false

# Codex's own command sandbox (bubblewrap) cannot start in the container (no user
# namespaces under cap_drop ALL / no-new-privileges), so every shell command
# fails. The container is the sandbox, as for iso-claude's
# --dangerously-skip-permissions (owner, 2026-10-27).
sandbox_mode = "danger-full-access"
approval_policy = "on-request"

[model_providers.amazon-bedrock.aws]
profile = "agent-bedrock"
# us-east-1: the gpt-6 models 404 on bedrock-mantle in eu-west-1, eu-central-1,
# eu-north-1 and us-west-2 (2026-10-27). allowlist.conf has the matching host.
region = "us-east-1"

[tui]
screen_reader_detection_done = true
